name: Faucet tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: server
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev libprotobuf-dev \
            libssl-dev make perl pkg-config protobuf-compiler
      - name: Install repository Rust toolchain
        run: |
          rustup toolchain install --profile minimal --no-self-update
          toolchain="$(rustup show active-toolchain)"
          toolchain="${toolchain%% *}"
          rustup component add --toolchain "$toolchain" rustfmt
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run backend tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cargo test --locked --all-targets 2>&1 | tee "$GITHUB_WORKSPACE/test-results/backend.log"
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: test-results/backend.log
          if-no-files-found: ignore
          retention-days: 7
