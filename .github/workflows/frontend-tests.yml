name: Faucet frontend tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-tests.yml'
      - '.github/workflows/deploy-faucet-frontend-*.yml'
  push:
    branches: [dev, main]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-tests.yml'
      - '.github/workflows/deploy-faucet-frontend-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          npm run test:amounts 2>&1 | tee "$GITHUB_WORKSPACE/test-results/frontend.log"
      - name: Build frontend
        run: npm run build 2>&1 | tee "$GITHUB_WORKSPACE/test-results/frontend-build.log"
      - name: Lint frontend
        run: npm run lint 2>&1 | tee "$GITHUB_WORKSPACE/test-results/frontend-lint.log"
      - name: Upload frontend test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-results
          path: test-results/frontend*.log
          if-no-files-found: ignore
          retention-days: 7
