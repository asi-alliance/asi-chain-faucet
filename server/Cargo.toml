[package]
name = "asi-faucet"
version = "0.1.0"
edition = "2021"
description = "A service for transferring ASI tokens on the ASI Chain"

[dependencies]
# Async runtime
tokio = { version = "1.54.1", features = ["full"] }

# Web framework and HTTP utilities
axum = { version = "0.8.9", features = ["macros"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "compression-br", "timeout", "cors", "limit"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Logging and diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Error handling
anyhow = "1.0.104"

# Utilities
regex = "1.13.1"
num-bigint = "0.4.8"
dotenv = "0.15.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.2", features = ["v4"] }
rand = "0.9.5"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }

# Client with typed deploy admission refusals (F1R3FLY-io/rust-client#86, on
# top of rust-dev 5d1c9b4). Repin to a merged commit before this leaves draft.
node_cli = { git = "https://github.com/F1R3FLY-io/rust-client.git", rev = "aa6f275d1e60ad5d92ae52beda8455615f7e6179", default-features = false }

[dev-dependencies]
proptest = "1.12.0"
